name: Node artifact
description: >-
  Sets up Node.js, builds the DataWeave Node package (which embeds dwlib), and
  runs the Node unit/integration tests (always). Optionally runs the master-only
  Node TCK conformance lane, and optionally publishes the .tgz as a CI artifact
  (main) or a release asset (release). Requires build-foundation earlier in the
  same job.
inputs:
  native-version:
    description: -PnativeVersion value; empty omits the flag.
    required: false
    default: ''
  run-tck:
    description: When 'true', run the master-only Node TCK conformance lane.
    required: false
    default: 'false'
  publish:
    description: "'none' | 'artifact' | 'release'."
    required: false
    default: 'none'
  repo-token:
    description: Token for svenstaro release upload (publish=release).
    required: false
    default: ''
  arch:
    description: Runtime arch token for artifact/asset names.
    required: false
    default: ''
  script-name:
    description: OS naming token (linux/windows/macos) for artifact/asset names.
    required: false
    default: ''
  tag:
    description: Release tag (publish=release).
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Create Native Lib Node Package
      run: ./gradlew --stacktrace --no-problems-report native-lib:buildNodePackage ${{ inputs.native-version != '' && format('-PnativeVersion={0}', inputs.native-version) || '' }}
      shell: bash

    - name: Run Node.js Tests
      run: ./gradlew --stacktrace --no-problems-report native-lib:nodeTest ${{ inputs.native-version != '' && format('-PnativeVersion={0}', inputs.native-version) || '' }}
      shell: bash

    - name: Run Node.js TCK Conformance
      if: always() && inputs.run-tck == 'true'
      # This is the dedicated (master-only) TCK lane. The corpus is staged once
      # by the shared TCK staging step earlier in the job (see main.yml). Set the
      # require-corpus flag so a missing/empty staged corpus fails this job loudly
      # instead of skipping silently (review #10 #7); local dev without the flag
      # still skips.
      env:
        DATAWEAVE_TCK_REQUIRE_CORPUS: '1'
      run: |
        cd native-lib/node && npm run test:tck
      shell: bash

    - name: Resolve Node package names
      if: inputs.publish != 'none'
      id: node-package
      run: |
        case "${{ inputs.script-name }}-${{ inputs.arch }}" in
          linux-x86_64) NPM_PLAT=linux-x64 ;;
          windows-x86_64) NPM_PLAT=win32-x64 ;;
          macos-arm64) NPM_PLAT=darwin-arm64 ;;
          *) echo "unmapped platform"; exit 1 ;;
        esac
        VER="${{ inputs.native-version }}"
        if [ -z "$VER" ]; then
          VER=$(awk -F= '/^nativeVersion=/ { print $2 }' gradle.properties)
        fi
        echo "platform_name=dataweave-native-${NPM_PLAT}-${VER}.tgz" >> "$GITHUB_OUTPUT"
        echo "meta_name=dataweave-native-${VER}.tgz" >> "$GITHUB_OUTPUT"
        echo "platform=native-lib/node/dataweave-native-${NPM_PLAT}-${VER}.tgz" >> "$GITHUB_OUTPUT"
        echo "meta=native-lib/node/dataweave-native-${VER}.tgz" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Upload platform Node package (artifact)
      if: inputs.publish == 'artifact'
      uses: actions/upload-artifact@v7.0.1
      with:
        path: ${{ steps.node-package.outputs.platform }}
        archive: false

    - name: Upload meta Node package (artifact)
      if: inputs.publish == 'artifact' && inputs.script-name == 'linux'
      uses: actions/upload-artifact@v7.0.1
      with:
        path: ${{ steps.node-package.outputs.meta }}
        archive: false

    - name: Upload platform Node package to release
      if: inputs.publish == 'release'
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ inputs.repo-token }}
        file: ${{ steps.node-package.outputs.platform }}
        asset_name: ${{ steps.node-package.outputs.platform_name }}
        tag: ${{ inputs.tag }}
        overwrite: true

    - name: Upload meta Node package to release
      if: inputs.publish == 'release' && inputs.script-name == 'linux'
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ inputs.repo-token }}
        file: ${{ steps.node-package.outputs.meta }}
        asset_name: ${{ steps.node-package.outputs.meta_name }}
        tag: ${{ inputs.tag }}
        overwrite: true
