# This is a basic workflow to help you get started with Actions

name: Build Native CLI

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
env:
  NATIVE_VERSION: 100.100.100
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  BUILD:
    strategy:
      fail-fast: false
      matrix:
        os: [ mulesoft-ubuntu, mulesoft-windows, macos-15 ]
        include:
          # script_name → artifact-name OS token (our naming convention).
          # distro_os   → Gradle distro classifier (native-cli getOsName():
          #               macOS is "osx", not "macos"), used for the source
          #               filename produced by native-cli:distro.
          - os: mulesoft-ubuntu
            script_name: linux
            distro_os: linux
          - os: mulesoft-windows
            script_name: windows
            distro_os: windows
          - os: macos-15
            script_name: macos
            distro_os: osx
    runs-on: ${{ matrix.os }}
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Derive platform tokens
        run: echo "ARCH=$(uname -m)" >> "$GITHUB_ENV"
        shell: bash

      - name: Set macOS deployment target
        if: runner.os == 'macOS'
        run: echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"
        shell: bash

      - name: Build foundation
        uses: ./.github/actions/build-foundation
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify macOS native deployment targets
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          for artifact in native-cli/build/native/nativeCompile/dw native-lib/build/native/nativeCompile/dwlib.dylib; do
            min_os=$(/usr/bin/otool -l "$artifact" | awk '$1 == "minos" { print $2; exit }')
            test "$min_os" = "11.0"
          done
        shell: bash

      - name: CLI
        uses: ./.github/actions/cli
        with:
          native-version: ${{ env.NATIVE_VERSION }}
          run-tck: ${{ github.ref == 'refs/heads/master' }}
          publish: 'artifact'
          arch: ${{ env.ARCH }}
          script-name: ${{ matrix.script_name }}
          distro-os: ${{ matrix.distro_os }}

      - name: Stage TCK corpus
        if: github.ref == 'refs/heads/master'
        run: ./gradlew --stacktrace --no-problems-report native-lib:stageTckSuites
        shell: bash

      - name: Python
        id: python
        uses: ./.github/actions/python
        continue-on-error: true
        with:
          native-version: ${{ env.NATIVE_VERSION }}
          break-system-packages: 'true'
          run-tck: ${{ github.ref == 'refs/heads/master' }}
          platform: ${{ matrix.script_name }}
          publish: 'artifact'

      - name: Node
        id: node
        uses: ./.github/actions/node
        continue-on-error: true
        with:
          native-version: ${{ env.NATIVE_VERSION }}
          run-tck: ${{ github.ref == 'refs/heads/master' }}
          publish: 'artifact'
          arch: ${{ env.ARCH }}
          script-name: ${{ matrix.script_name }}

      - name: Native library
        uses: ./.github/actions/native-lib
        with:
          native-version: ${{ env.NATIVE_VERSION }}
          publish: 'artifact'
          arch: ${{ env.ARCH }}
          script-name: ${{ matrix.script_name }}

      - name: Fail if binding artifacts failed
        if: always() && (steps.python.outcome == 'failure' || steps.node.outcome == 'failure')
        run: exit 1
        shell: bash
