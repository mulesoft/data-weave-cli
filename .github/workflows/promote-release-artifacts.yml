name: Promote release artifacts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub release tag (v1.2.3)
        required: true
        type: string
      artifact:
        description: Artifact to promote
        required: true
        type: choice
        default: all
        options:
          - cli
          - node
          - python
          - all
      dry_run:
        description: Validate the selected promotion and print changes without publishing
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  homebrew:
    if: inputs.artifact == 'cli' || inputs.artifact == 'all'
    runs-on: mulesoft-ubuntu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Resolve tag and download macOS CLI zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION=$(node --input-type=module -e "import { parseTag } from './scripts/promote/homebrew.mjs'; console.log(parseTag(process.env.TAG));")
          ASSET=$(VERSION="$VERSION" node --input-type=module -e "import { assetName } from './scripts/promote/homebrew.mjs'; console.log(assetName(process.env.VERSION));")
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fx "$ASSET"
          gh release download "$TAG" --pattern "$ASSET"
          unzip -Z1 "$ASSET" | grep -Fx 'bin/dw'
          SHA=$(sha256sum "$ASSET" | awk '{print $1}')
          {
            echo "VERSION=$VERSION"
            echo "ASSET=$ASSET"
            echo "SHA=$SHA"
          } >> "$GITHUB_ENV"
      - name: Checkout tap
        uses: actions/checkout@v4
        with:
          repository: mulesoft/homebrew-data-weave
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Rewrite formula
        id: formula
        env:
          TAG: ${{ inputs.tag }}
          SHA: ${{ env.SHA }}
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import { appendFileSync, readFileSync, writeFileSync } from "node:fs";
          import {
            alreadyPromoted,
            parseTag,
            releaseAssetUrl,
            rewriteFormula,
          } from "./scripts/promote/homebrew.mjs";

          const tag = process.env.TAG;
          const version = parseTag(tag);
          const formulaPath = "tap/formula/dw.rb";
          const formula = readFileSync(formulaPath, "utf8");

          if (alreadyPromoted(formula, version)) {
            console.log(`already promoted: ${version}`);
            appendFileSync(process.env.GITHUB_OUTPUT, "skipped=true\n");
            process.exit(0);
          }

          const next = rewriteFormula(formula, {
            url: releaseAssetUrl("mulesoft/data-weave-cli", tag, version),
            sha256: process.env.SHA,
            version,
          });
          writeFileSync(formulaPath, next);
          console.log(next);
          appendFileSync(process.env.GITHUB_OUTPUT, "skipped=false\n");
          EOF
      - name: Open tap pull request
        if: steps.formula.outputs.skipped == 'false' && inputs.dry_run == false
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ env.VERSION }}
          ASSET: ${{ env.ASSET }}
          SHA: ${{ env.SHA }}
        working-directory: tap
        run: |
          set -euo pipefail
          BRANCH="promote-dw-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add formula/dw.rb
          git commit -m "chore: promote dw ${VERSION}"
          git push -u origin "$BRANCH" --force
          if gh pr list --repo mulesoft/homebrew-data-weave --head "$BRANCH" --json number --jq '.[0].number' | grep -q .; then
            echo "PR already open"
          else
            gh pr create --repo mulesoft/homebrew-data-weave --base master --head "$BRANCH" \
              --title "Promote dw ${VERSION}" \
              --body "From ${TAG} asset ${ASSET} sha256 ${SHA}"
          fi

  node:
    if: inputs.artifact == 'node' || inputs.artifact == 'all'
    runs-on: mulesoft-ubuntu
    permissions:
      contents: read
      # Lets npm exchange GitHub's short-lived OIDC token for publish credentials.
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: Upgrade npm for OIDC trusted publishing support
        run: npm install -g npm@latest
      - name: Verify Node package versions are not published
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          PACKAGES=(
            dataweave-native-linux-x64
            dataweave-native-win32-x64
            dataweave-native-darwin-arm64
            dataweave-native
          )

          for PACKAGE in "${PACKAGES[@]}"; do
            set +e
            OUTPUT=$(npm view "${PACKAGE}@${VERSION}" version --json 2>&1)
            STATUS=$?
            set -e
            if [ "$STATUS" -eq 0 ]; then
              echo "Node package version already exists: ${PACKAGE}@${VERSION}"
              exit 1
            fi
            if ! printf '%s\n' "$OUTPUT" | grep -q 'E404'; then
              echo "Unable to determine whether ${PACKAGE}@${VERSION} exists"
              printf '%s\n' "$OUTPUT"
              exit "$STATUS"
            fi
          done
      - name: Print Node package promotion
        if: inputs.dry_run
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          for PACKAGE in \
            dataweave-native-linux-x64 \
            dataweave-native-win32-x64 \
            dataweave-native-darwin-arm64 \
            dataweave-native; do
            echo "npm publish ${PACKAGE}-${VERSION}.tgz --access public"
          done
      - name: Download and validate Node packages
        if: inputs.dry_run == false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          RELEASE_DIR=$(mktemp -d)
          echo "RELEASE_DIR=$RELEASE_DIR" >> "$GITHUB_ENV"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$RELEASE_DIR" \
            --pattern "dataweave-native-${VERSION}.tgz" \
            --pattern "dataweave-native-linux-x64-${VERSION}.tgz" \
            --pattern "dataweave-native-win32-x64-${VERSION}.tgz" \
            --pattern "dataweave-native-darwin-arm64-${VERSION}.tgz"

          ASSETS=(
            "dataweave-native-linux-x64-${VERSION}.tgz"
            "dataweave-native-win32-x64-${VERSION}.tgz"
            "dataweave-native-darwin-arm64-${VERSION}.tgz"
            "dataweave-native-${VERSION}.tgz"
          )
          PACKAGES=(
            dataweave-native-linux-x64
            dataweave-native-win32-x64
            dataweave-native-darwin-arm64
            dataweave-native
          )

          for INDEX in "${!ASSETS[@]}"; do
            ASSET="$RELEASE_DIR/${ASSETS[$INDEX]}"
            PACKAGE="${PACKAGES[$INDEX]}"
            if [ ! -f "$ASSET" ]; then
              echo "Release asset is missing: ${ASSETS[$INDEX]}"
              exit 1
            fi
            tar -xOzf "$ASSET" package/package.json | node --input-type=module -e '
              import { readFileSync } from "node:fs";
              const packageJson = JSON.parse(readFileSync(0, "utf8"));
              const [expectedName, expectedVersion] = process.argv.slice(1);
              if (packageJson.name !== expectedName || packageJson.version !== expectedVersion) {
                throw new Error(`Expected ${expectedName}@${expectedVersion}, found ${packageJson.name}@${packageJson.version}`);
              }
            ' "$PACKAGE" "$VERSION"
          done
      - name: Publish Node packages via OIDC trusted publishing
        if: inputs.dry_run == false
        env:
          TAG: ${{ inputs.tag }}
          RELEASE_DIR: ${{ env.RELEASE_DIR }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          for ASSET in \
            "dataweave-native-linux-x64-${VERSION}.tgz" \
            "dataweave-native-win32-x64-${VERSION}.tgz" \
            "dataweave-native-darwin-arm64-${VERSION}.tgz" \
            "dataweave-native-${VERSION}.tgz"; do
            # These tarballs are built by the release workflow, so promotion does
            # not attach provenance for the download-and-publish step.
            npm publish "$RELEASE_DIR/$ASSET" --access public --provenance=false
          done

  python:
    if: inputs.artifact == 'python' || inputs.artifact == 'all'
    runs-on: mulesoft-ubuntu
    environment: pypi
    permissions:
      contents: read
      # Lets PyPI exchange GitHub's short-lived OIDC token for upload credentials.
      id-token: write
    steps:
      - name: Verify Python package version is not published
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          RESPONSE=$(mktemp)
          STATUS=$(curl --silent --show-error --output "$RESPONSE" --write-out '%{http_code}' \
            "https://pypi.org/pypi/dataweave-native/${VERSION}/json")
          case "$STATUS" in
            404)
              echo "dataweave-native@${VERSION} is not published"
              ;;
            200)
              echo "Python package version already exists: dataweave-native@${VERSION}"
              exit 1
              ;;
            *)
              echo "Unable to determine whether dataweave-native@${VERSION} exists"
              cat "$RESPONSE"
              exit 1
              ;;
          esac
      - name: Print Python package promotion
        if: inputs.dry_run
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          echo "Publish dataweave_native-${VERSION}-py3-none-*.whl to PyPI via OIDC"
      - name: Download and validate Python wheels
        if: inputs.dry_run == false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          RELEASE_DIR="release-assets/python"
          mkdir -p "$RELEASE_DIR"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$RELEASE_DIR" \
            --pattern "dataweave_native-${VERSION}-py3-none-*.whl"

          shopt -s nullglob
          WHEELS=("$RELEASE_DIR"/dataweave_native-"${VERSION}"-py3-none-*.whl)
          if [ "${#WHEELS[@]}" -ne 3 ]; then
            echo "Expected three Python wheels for ${TAG}, found ${#WHEELS[@]}"
            exit 1
          fi

          for WHEEL in "${WHEELS[@]}"; do
            METADATA_PATH=$(unzip -Z1 "$WHEEL" | awk '/\.dist-info\/METADATA$/ { print; exit }')
            if [ -z "$METADATA_PATH" ]; then
              echo "Wheel metadata is missing: $WHEEL"
              exit 1
            fi
            # Windows wheels store METADATA with CRLF line endings; normalize
            # them so the field checks below are platform-independent.
            METADATA=$(unzip -p "$WHEEL" "$METADATA_PATH" | tr -d '\r')
            if ! grep -qx 'Name: dataweave-native' <<<"$METADATA" || \
              ! grep -qx "Version: ${VERSION}" <<<"$METADATA"; then
              echo "Unexpected package metadata in $WHEEL"
              exit 1
            fi
          done
      - name: Publish Python wheels via PyPI trusted publishing
        if: inputs.dry_run == false
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: release-assets/python
