name: Release DataWeave Native CLI
on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:

  # This workflow contains a single job called "build"
  RELEASE_EXTENSION:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-2022, macos-latest ]
        include:
          # script_name → artifact-name OS token (our naming convention).
          # distro_os   → Gradle distro classifier (native-cli getOsName():
          #               macOS is "osx", not "macos"), used for the source
          #               filename produced by native-cli:distro.
          - os: ubuntu-latest
            script_name: linux
            distro_os: linux
          - os: windows-2022
            script_name: windows
            distro_os: windows
          - os: macos-latest
            script_name: macos
            distro_os: osx
    runs-on: ${{ matrix.os }}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Guess Extension Version
        run: |
          echo "NATIVE_VERSION=$(echo '${{github.ref}}' | sed -e 's,.*/v\(.*\),\1,')" >> $GITHUB_ENV
          echo "ARCH=$(uname -m)" >> $GITHUB_ENV
        shell: bash

      - name: Build native artifacts
        uses: ./.github/actions/build-native
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-version: ${{ env.NATIVE_VERSION }}
          break-system-packages: 'true'

      # Upload the artifact file
      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: native-cli/build/distributions/native-cli-${{env.NATIVE_VERSION}}-native-distro-${{ matrix.distro_os }}.zip
          asset_name: dw-cli-${{env.NATIVE_VERSION}}-${{ matrix.script_name }}-${{ env.ARCH }}.zip
          tag: ${{ github.ref }}
          overwrite: true

      # Upload the Python wheel
      - name: Upload Python wheel to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: native-lib/python/dist/dataweave_native-0.0.1-py3-none-*.whl
          file_glob: true
          tag: ${{ github.ref }}
          overwrite: true

      # Upload the Node.js package
      - name: Upload Node package to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: native-lib/node/dataweave-native-0.0.1.tgz
          asset_name: dataweave-node-0.0.1-${{ matrix.script_name }}-${{ env.ARCH }}.tgz
          tag: ${{ github.ref }}
          overwrite: true

      # Upload the native shared library
      - name: Upload native shared library to release (Linux)
        if: runner.os == 'Linux'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: native-lib/python/src/dataweave/native/dwlib.so
          asset_name: dwlib-${{env.NATIVE_VERSION}}-${{ matrix.script_name }}-${{ env.ARCH }}.so
          tag: ${{ github.ref }}
          overwrite: true

      - name: Upload native shared library to release (Windows)
        if: runner.os == 'Windows'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: native-lib/python/src/dataweave/native/dwlib.dll
          asset_name: dwlib-${{env.NATIVE_VERSION}}-${{ matrix.script_name }}-${{ env.ARCH }}.dll
          tag: ${{ github.ref }}
          overwrite: true

      - name: Upload native shared library to release (macOS)
        if: runner.os == 'macOS'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: native-lib/python/src/dataweave/native/dwlib.dylib
          asset_name: dwlib-${{env.NATIVE_VERSION}}-${{ matrix.script_name }}-${{ env.ARCH }}.dylib
          tag: ${{ github.ref }}
          overwrite: true

      # Upload the native library header
      - name: Upload native library header to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: native-lib/python/src/dataweave/native/dwlib.h
          asset_name: dwlib-${{env.NATIVE_VERSION}}.h
          tag: ${{ github.ref }}
          overwrite: true
