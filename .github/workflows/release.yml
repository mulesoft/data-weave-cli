name: Release DataWeave Native CLI
on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:

  # This workflow contains a single job called "build"
  RELEASE_EXTENSION:
    strategy:
      fail-fast: false
      matrix:
        os: [ mulesoft-ubuntu, mulesoft-windows, macos-latest ]
        include:
          # script_name → artifact-name OS token (our naming convention).
          # distro_os   → Gradle distro classifier (native-cli getOsName():
          #               macOS is "osx", not "macos"), used for the source
          #               filename produced by native-cli:distro.
          - os: mulesoft-ubuntu
            script_name: linux
            distro_os: linux
          - os: mulesoft-windows
            script_name: windows
            distro_os: windows
          - os: macos-latest
            script_name: macos
            distro_os: osx
    runs-on: ${{ matrix.os }}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Guess Extension Version
        run: |
          echo "NATIVE_VERSION=$(echo '${{github.ref}}' | sed -e 's,.*/v\(.*\),\1,')" >> $GITHUB_ENV
          echo "ARCH=$(uname -m)" >> $GITHUB_ENV
        shell: bash

      - name: Build foundation
        uses: ./.github/actions/build-foundation
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-version: ${{ env.NATIVE_VERSION }}

      - name: CLI
        uses: ./.github/actions/cli
        with:
          native-version: ${{ env.NATIVE_VERSION }}
          publish: 'artifact'
          arch: ${{ env.ARCH }}
          script-name: ${{ matrix.script_name }}
          distro-os: ${{ matrix.distro_os }}

      - name: Python
        uses: ./.github/actions/python
        with:
          native-version: ${{ env.NATIVE_VERSION }}
          break-system-packages: 'true'
          platform: ${{ matrix.script_name }}-${{ env.ARCH }}
          publish: 'artifact'

      - name: Node
        uses: ./.github/actions/node
        with:
          native-version: ${{ env.NATIVE_VERSION }}
          publish: 'artifact'
          arch: ${{ env.ARCH }}
          script-name: ${{ matrix.script_name }}

      - name: Native library
        uses: ./.github/actions/native-lib
        with:
          native-version: ${{ env.NATIVE_VERSION }}
          publish: 'artifact'
          arch: ${{ env.ARCH }}
          script-name: ${{ matrix.script_name }}

  publish-release:
    needs: RELEASE_EXTENSION
    runs-on: mulesoft-ubuntu
    permissions:
      contents: write
    steps:
      - name: Download CLI archives
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: dw-cli-*
          merge-multiple: true
          skip-decompress: true
      - name: Download Python wheels
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: dataweave_native-*.whl
          merge-multiple: true
          skip-decompress: true
      - name: Download Node packages
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: dataweave-native-*.tgz
          merge-multiple: true
      - name: Download native libraries
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: dwlib-*
      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          HEADER=$(find "release-assets/dwlib-${VERSION}-linux-x86_64" -maxdepth 1 -name 'dwlib.h' -print -quit)
          if [ -z "$HEADER" ]; then
            echo "dwlib.h is missing"
            exit 1
          fi
          mv "$HEADER" "$RUNNER_TEMP/dwlib.h"
          find release-assets -type f -name 'dwlib.h' -delete
          mv "$RUNNER_TEMP/dwlib.h" "release-assets/dwlib-${VERSION}.h"
          for platform in linux-x86_64 windows-x86_64 macos-arm64; do
            case "$platform" in
              linux-x86_64) extension=so ;;
              windows-x86_64) extension=dll ;;
              macos-arm64) extension=dylib ;;
            esac
            source="release-assets/dwlib-${VERSION}-${platform}/dwlib.${extension}"
            if [ ! -f "$source" ]; then
              echo "native library is missing: $source"
              exit 1
            fi
            mv "$source" "release-assets/dwlib-${VERSION}-${platform}.${extension}"
          done
          mapfile -d '' assets < <(find release-assets -type f -name '*.zip' -print0)
          if [ "${#assets[@]}" -ne 3 ]; then
            echo "expected three CLI archives, found ${#assets[@]}"
            exit 1
          fi
          mapfile -d '' -O "${#assets[@]}" assets < <(find release-assets -type f -name '*.whl' -print0)
          if [ "${#assets[@]}" -ne 6 ]; then
            echo "expected three Python wheels"
            exit 1
          fi
          mapfile -d '' -O "${#assets[@]}" assets < <(find release-assets -type f -name '*.tgz' -print0)
          if [ "${#assets[@]}" -ne 10 ]; then
            echo "expected four Node packages"
            exit 1
          fi
          assets+=(
            "release-assets/dwlib-${VERSION}-linux-x86_64.so"
            "release-assets/dwlib-${VERSION}-windows-x86_64.dll"
            "release-assets/dwlib-${VERSION}-macos-arm64.dylib"
            "release-assets/dwlib-${VERSION}.h"
          )
          for asset in "${assets[@]}"; do
            if [ ! -f "$asset" ]; then
              echo "release asset is missing: $asset"
              exit 1
            fi
          done
          gh release view "$TAG" || gh release create "$TAG" --generate-notes
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "release artifacts are missing"
            exit 1
          fi
          gh release upload "$TAG" "${assets[@]}" --clobber
