name: Release DataWeave Native CLI
on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:

  # This workflow contains a single job called "build"
  RELEASE_EXTENSION:
    strategy:
      fail-fast: false
      matrix:
        os: [ mulesoft-ubuntu, mulesoft-windows, macos-latest ]
        include:
          # script_name → artifact-name OS token (our naming convention).
          # distro_os   → Gradle distro classifier (native-cli getOsName():
          #               macOS is "osx", not "macos"), used for the source
          #               filename produced by native-cli:distro.
          - os: mulesoft-ubuntu
            script_name: linux
            distro_os: linux
          - os: mulesoft-windows
            script_name: windows
            distro_os: windows
          - os: macos-latest
            script_name: macos
            distro_os: osx
    runs-on: ${{ matrix.os }}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Guess Extension Version
        run: |
          echo "NATIVE_VERSION=$(echo '${{github.ref}}' | sed -e 's,.*/v\(.*\),\1,')" >> $GITHUB_ENV
          echo "ARCH=$(uname -m)" >> $GITHUB_ENV
        shell: bash

      - name: Build foundation
        uses: ./.github/actions/build-foundation
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-version: ${{ env.NATIVE_VERSION }}

      - name: CLI
        uses: ./.github/actions/cli
        with:
          native-version: ${{ env.NATIVE_VERSION }}
          publish: 'artifact'
          arch: ${{ env.ARCH }}
          script-name: ${{ matrix.script_name }}
          distro-os: ${{ matrix.distro_os }}

      - name: Python
        uses: ./.github/actions/python
        with:
          native-version: ${{ env.NATIVE_VERSION }}
          break-system-packages: 'true'
          platform: ${{ matrix.script_name }}-${{ env.ARCH }}
          publish: 'artifact'

      - name: Node
        uses: ./.github/actions/node
        with:
          native-version: ${{ env.NATIVE_VERSION }}
          publish: 'artifact'
          arch: ${{ env.ARCH }}
          script-name: ${{ matrix.script_name }}

      - name: Native library
        uses: ./.github/actions/native-lib
        with:
          native-version: ${{ env.NATIVE_VERSION }}
          publish: 'artifact'
          arch: ${{ env.ARCH }}
          script-name: ${{ matrix.script_name }}

  publish-release:
    needs: RELEASE_EXTENSION
    runs-on: mulesoft-ubuntu
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          HEADER=$(find release-assets -type f -name 'dwlib.h' -print -quit)
          if [ -z "$HEADER" ]; then
            echo "dwlib.h is missing"
            exit 1
          fi
          mv "$HEADER" "$RUNNER_TEMP/dwlib.h"
          find release-assets -type f -name 'dwlib.h' -delete
          mv "$RUNNER_TEMP/dwlib.h" "release-assets/dwlib-${TAG#v}.h"
          gh release view "$TAG" || gh release create "$TAG" --generate-notes
          shopt -s nullglob
          assets=(
            release-assets/*.zip
            release-assets/*.whl
            release-assets/*.tgz
            release-assets/*.so
            release-assets/*.dll
            release-assets/*.dylib
            release-assets/*.h
          )
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "release artifacts are missing"
            exit 1
          fi
          gh release upload "$TAG" "${assets[@]}" --clobber
