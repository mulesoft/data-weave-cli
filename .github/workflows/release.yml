name: Release DataWeave Native CLI
on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:

  # This workflow contains a single job called "build"
  RELEASE_EXTENSION:
    strategy:
      fail-fast: false
      matrix:
        os: [ mulesoft-ubuntu, mulesoft-windows, macos-latest ]
        include:
          # script_name → artifact-name OS token (our naming convention).
          # distro_os   → Gradle distro classifier (native-cli getOsName():
          #               macOS is "osx", not "macos"), used for the source
          #               filename produced by native-cli:distro.
          - os: mulesoft-ubuntu
            script_name: linux
            distro_os: linux
          - os: mulesoft-windows
            script_name: windows
            distro_os: windows
          - os: macos-latest
            script_name: macos
            distro_os: osx
    runs-on: ${{ matrix.os }}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Guess Extension Version
        run: |
          echo "NATIVE_VERSION=$(echo '${{github.ref}}' | sed -e 's,.*/v\(.*\),\1,')" >> $GITHUB_ENV
          echo "ARCH=$(uname -m)" >> $GITHUB_ENV
        shell: bash

      - name: Build foundation
        uses: ./.github/actions/build-foundation
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-version: ${{ env.NATIVE_VERSION }}

      - name: CLI
        uses: ./.github/actions/cli
        with:
          native-version: ${{ env.NATIVE_VERSION }}
          publish: 'release'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref }}
          arch: ${{ env.ARCH }}
          script-name: ${{ matrix.script_name }}
          distro-os: ${{ matrix.distro_os }}

      - name: Python
        uses: ./.github/actions/python
        with:
          native-version: ${{ env.NATIVE_VERSION }}
          break-system-packages: 'true'
          publish: 'release'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref }}

      - name: Node
        uses: ./.github/actions/node
        with:
          native-version: ${{ env.NATIVE_VERSION }}
          publish: 'release'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref }}
          arch: ${{ env.ARCH }}
          script-name: ${{ matrix.script_name }}

      - name: Native library
        uses: ./.github/actions/native-lib
        with:
          native-version: ${{ env.NATIVE_VERSION }}
          publish: 'release'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref }}
          arch: ${{ env.ARCH }}
          script-name: ${{ matrix.script_name }}
