buildscript {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
    dependencies {
        classpath "org.graalvm.buildtools.native:org.graalvm.buildtools.native.gradle.plugin:0.11.2"
    }
}

plugins {
    id "scala"
    id "maven-publish"
    id "distribution"
    id 'java-library'
}

subprojects {

    apply plugin: 'java-library'
    apply plugin: 'maven-publish'
    apply plugin: 'scala'

    apply plugin: 'org.graalvm.buildtools.native'

    group = 'org.mule.weave.native'
    version = nativeVersion

//    compileScala {
//        targetCompatibility = "24"
//        sourceCompatibility = "11"
//    }


    compileJava {
        sourceCompatibility = '17'
        targetCompatibility = '17'
    }

    repositories {
//        mavenLocal()
        mavenCentral()
        maven {
            name = "mule-releases"
            url = "https://repository.mulesoft.org/nexus/content/repositories/releases/"
        }
        maven {
            name = "mule-snapshots"
            url = "https://repository.mulesoft.org/nexus/content/repositories/snapshots/"
        }
        maven {
            name = "jitpack.io"
            url = "https://jitpack.io"
        }
        gradlePluginPortal()
    }


    dependencies {
        implementation "org.scala-lang:scala-library:${scalaVersion}"
    }

    // Ensure nativeCompile tasks declare their output directories for proper
    // Gradle up-to-date checks and cross-project dependency resolution
    tasks.matching { it.name == 'nativeCompile' }.configureEach { t ->
        t.outputs.dir("${project.buildDir}/native/nativeCompile")
    }
}