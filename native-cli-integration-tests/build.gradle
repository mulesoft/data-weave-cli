plugins {
    id "com.github.maiflai.scalatest" version "${scalaTestPluginVersion}"
}

configurations {
    weaveSuite
}

sourceSets {
    test {
        resources {
            srcDirs += ["build/resources"]
        }
    }
}

dependencies {
    api(project(":native-cli"))

    weaveSuite "org.mule.weave:runtime:${weaveTCKVersion}:tck@zip"
    weaveSuite "org.mule.weave:yaml-module:${weaveTCKVersion}:tck@zip"
    weaveSuite "org.mule.weave:core-modules:${weaveTCKVersion}:tck@zip"
    testRuntimeOnly 'com.vladsch.flexmark:flexmark-all:0.64.8'
    // https://mvnrepository.com/artifact/org.scalatest/scalatest
    testImplementation group: 'org.scalatest', name: 'scalatest_2.12', version: '3.2.19'

    testImplementation "org.mule.weave:test-helpers:${weaveVersion}"
    testImplementation 'commons-io:commons-io:2.11.0'
    testImplementation 'com.sun.mail:jakarta.mail:1.6.4'
    testImplementation 'xerces:xercesImpl:2.12.1'
    testImplementation 'xalan:xalan:2.7.2'
    testImplementation 'commons-beanutils:commons-beanutils:1.9.4'
    implementation group: 'com.sun.mail', name: 'jakarta.mail', version: '2.0.1'
}

tasks.register('cleanTestSuites', Delete) {
    delete "$projectDir/build/resources/weave-suites"
}

tasks.register('downloadTestSuites', Copy) {
    from configurations.weaveSuite
    into "$projectDir/build/resources/weave-suites"
}

tasks.named('processTestResources') {
    dependsOn(downloadTestSuites)
}

tasks.named('processResources') {
    dependsOn('processTestResources')
}


downloadTestSuites.dependsOn(cleanTestSuites)
test.dependsOn(downloadTestSuites)
test.dependsOn(":native-cli:nativeCompile")

// TCK conformance is master-only. On non-master CI, build-foundation passes
// -PskipTCKTests=true; we exclude the TckConformance-tagged scenarios so they
// don't run, while the module's other IT specs still do. This uses ScalaTest
// tag exclusion (maiflai's `tags { exclude }` -> scalatest `-l <tag>`) rather
// than Gradle's Test.exclude class-pattern filter, which is a no-op under the
// maiflai scalatest runner. Mirrors the master-only Node TCK lane.
test {
    if (project.hasProperty('skipTCKTests') && project.property('skipTCKTests') == 'true') {
        tags {
            exclude 'org.mule.weave.clinative.TckConformance'
        }
    }
}
