dependencies {
  api group: 'org.mule.weave', name: 'runtime', version: weaveVersion
  api group: 'org.mule.weave', name: 'core-modules', version: weaveVersion

  implementation group: 'org.mule.weave', name: 'parser', version: weaveVersion
  implementation group: 'org.mule.weave', name: 'wlang', version: weaveVersion
  compileOnly group: 'org.graalvm.sdk', name: 'graal-sdk', version: graalvmVersion
  compileOnly group: 'org.graalvm.nativeimage', name: 'svm', version: graalvmVersion

  implementation "org.scala-lang:scala-library:${scalaVersion}"
  implementation 'org.json:json:20240303'

  testImplementation platform('org.junit:junit-bom:5.10.0')
  testImplementation 'org.junit.jupiter:junit-jupiter'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
  useJUnitPlatform()
}

tasks.matching { it.name == 'nativeCompileClasspathJar' }.configureEach { t ->
  t.exclude('META-INF/services/org.mule.weave.v2.module.DataFormat')
  t.from("${projectDir}/src/main/resources/META-INF/services/org.mule.weave.v2.module.DataFormat") {
    into('META-INF/services')
    rename { 'org.mule.weave.v2.module.DataFormat' }
  }
  t.exclude('META-INF/services/org.mule.weave.v2.parser.phase.ModuleLoader')
  t.from("${projectDir}/src/main/resources/META-INF/services/org.mule.weave.v2.parser.phase.ModuleLoader") {
    into('META-INF/services')
    rename { 'org.mule.weave.v2.parser.phase.ModuleLoader' }
  }
}

// Configure GraalVM native-image to build a shared library
graalvmNative {
//  toolchainDetection = true
  binaries {
    main {
      sharedLibrary = true
      debug = true
      verbose = true
      fallback = false
      //agent = false
      useFatJar = true
      //buildArgs.add('-Ob') //  quick build mode to speed up builds during development
      buildArgs.add('--no-fallback')
      buildArgs.add('-H:Name=dwlib')
      buildArgs.add('--verbose')
      buildArgs.add("--report-unsupported-elements-at-runtime")
      buildArgs.add("-J-Xmx6G")

      buildArgs.add("-H:+ReportExceptionStackTraces")
      buildArgs.add("-H:+UnlockExperimentalVMOptions")
      buildArgs.add("--initialize-at-build-time=sun.instrument.InstrumentationImpl")
      buildArgs.add("-H:DeadlockWatchdogInterval=1000")
      buildArgs.add("-H:CompilationExpirationPeriod=0")
      buildArgs.add("-H:+AddAllCharsets")
      buildArgs.add("-H:+IncludeAllLocales")
      // Pass project directory as system property for header path resolution
      buildArgs.add("-Dproject.root=${projectDir}")
    }
  }
}

// On Linux/macOS, create libdwlib.so symlink for standard -ldwlib linking
tasks.named('nativeCompile').configure {
  doLast {
    if (!System.getProperty('os.name').toLowerCase().contains('windows')) {
      def nativeDir = file("${layout.buildDirectory.get().asFile}/native/nativeCompile")
      def dwlibFile = fileTree(nativeDir).matching { include 'dwlib.so', 'dwlib.dylib' }.singleFile
      if (dwlibFile?.exists()) {
        def ext = dwlibFile.name.endsWith('.dylib') ? '.dylib' : '.so'
        def symlinkTarget = new File(nativeDir, "lib${dwlibFile.name}")
        if (!symlinkTarget.exists() || symlinkTarget.canonicalFile != dwlibFile.canonicalFile) {
          ant.symlink(link: symlinkTarget, resource: dwlibFile.name, overwrite: true)
        }
      }
    }
  }
}

// Strip debug symbols from native library to reduce artifact size (only on CI or when skipStripDebug is not set)
tasks.register('stripNativeLibrary', Exec) {
  dependsOn tasks.named('nativeCompile')

  onlyIf {
    // Skip stripping if explicitly disabled (for local development with debugging)
    project.findProperty('skipStripDebug')?.toString()?.toBoolean() != true
  }

  def nativeDir = file("${layout.buildDirectory.get().asFile}/native/nativeCompile")

  if (System.getProperty('os.name').toLowerCase().contains('windows')) {
    // Windows: Use strip from mingw-w64 or MSYS2 if available
    workingDir(nativeDir)
    commandLine('cmd', '/c', 'where strip >nul 2>&1 && strip --strip-debug dwlib.dll || echo Strip not available on Windows, skipping')
    ignoreExitValue = true  // Don't fail if strip is not available on Windows
  } else if (System.getProperty('os.name').toLowerCase().contains('mac')) {
    // macOS: Use strip -S to remove debug symbols
    workingDir(nativeDir)
    commandLine('strip', '-S', 'dwlib.dylib')
  } else {
    // Linux: Use strip --strip-debug
    workingDir(nativeDir)
    commandLine('strip', '--strip-debug', 'dwlib.so')
  }

  doLast {
    if (executionResult.get().exitValue == 0) {
      println("✓ Stripped debug symbols from native library")
    }
  }
}

def pythonExe = (project.findProperty('pythonExe') ?: 'python3') as String

tasks.register('stagePythonNativeLib', Copy) {
  dependsOn tasks.named('stripNativeLibrary')
  from("${layout.buildDirectory.get().asFile}/native/nativeCompile") {
    include('dwlib.*')
    // Exclude GraalVM's separate debug-info file (e.g. dwlib.so.debug on Linux):
    // it's dev-only crash-symbolication data the runtime never loads, and would
    // otherwise bloat the distributed wheel. Kept in the build dir for debugging.
    exclude('*.debug')
  }
  into("${projectDir}/python/src/dataweave/native")
}

tasks.register('buildPythonWheel', Exec) {
  dependsOn tasks.named('stagePythonNativeLib')
  workingDir("${projectDir}/python")
  // Track inputs so Gradle rebuilds when native lib or Python sources change
  inputs.dir("${projectDir}/python/src/dataweave")
  inputs.file("${projectDir}/python/setup.py")
  inputs.file("${projectDir}/python/setup.cfg")
  inputs.file("${projectDir}/python/pyproject.toml")
  outputs.dir("${projectDir}/python/dist")
  doFirst {
    // Clean old wheels and build artifacts to ensure fresh build
    delete("${projectDir}/python/dist")
    delete("${projectDir}/python/build")
    file("${projectDir}/python/dist").mkdirs()
  }
  // Use setup.py bdist_wheel to generate platform-specific wheel tags
  // The custom setup.py overrides bdist_wheel to set correct platform tags
  // for the bundled native library (dwlib)
  commandLine(pythonExe, 'setup.py', 'bdist_wheel', '-d', 'dist')
}

tasks.register('pythonTest', Exec) {
  if (project.findProperty('skipPythonTests')?.toString()?.toBoolean() == true) {
    enabled = false
  }

  dependsOn tasks.named('stagePythonNativeLib')
  workingDir("${projectDir}/python")
  inputs.dir("${projectDir}/python/tests")
  inputs.file("${projectDir}/python/pytest.ini")
  inputs.file("${projectDir}/python/pyproject.toml")
  def testReportsDir = layout.buildDirectory.dir('test-results/python')
  def coverageReportsDir = layout.buildDirectory.dir('reports/coverage/python')
  outputs.file(testReportsDir.map { it.file('junit.xml') })
  outputs.file(coverageReportsDir.map { it.file('coverage.xml') })
  doFirst {
    testReportsDir.get().asFile.mkdirs()
    coverageReportsDir.get().asFile.mkdirs()
  }
  commandLine(
    pythonExe,
    '-m',
    'pytest',
    '-m',
    'unit or integration',
    '--junitxml', testReportsDir.map { it.file('junit.xml') }.get().asFile,
    '--cov=dataweave',
    '--cov-report=xml:' + coverageReportsDir.map { it.file('coverage.xml') }.get().asFile,
  )
}

// --- Node.js native package tasks ---

def nodePlatformToken
def osName = System.getProperty('os.name').toLowerCase()
if (osName.contains('windows')) {
  nodePlatformToken = 'win32-x64'
} else if (osName.contains('mac')) {
  nodePlatformToken = 'darwin-arm64'
} else {
  nodePlatformToken = 'linux-x64'
}

tasks.register('stageNodeNativeLib', Copy) {
  dependsOn tasks.named('stripNativeLibrary')
  from("${layout.buildDirectory.get().asFile}/native/nativeCompile") {
    include('dwlib.*')
    // Exclude GraalVM's separate debug-info file (e.g. dwlib.so.debug on Linux):
    // it's dev-only crash-symbolication data the runtime never loads, and would
    // otherwise bloat the packed .tgz. Kept in the build dir for debugging.
    exclude('*.debug')
  }
  into("${projectDir}/node/native")
}

// --- Node.js TCK conformance suite staging ---
// Downloads the same DataWeave test-suite zips the CLI regression uses and
// unzips each into node/tests/tck/suites/<suite>/ for the Node `tck` vitest
// lane. Not wired into `nodeTest` (which runs on PRs) — invoked on demand and
// by the master-only TCK CI step, mirroring native-cli-integration-tests.
configurations {
  weaveTckSuite
}

dependencies {
  weaveTckSuite "org.mule.weave:runtime:${weaveTCKVersion}:tck@zip"
  weaveTckSuite "org.mule.weave:core-modules:${weaveTCKVersion}:tck@zip"
}

def tckSuitesDir = "${projectDir}/node/tests/tck/suites"

tasks.register('cleanTckSuites', Delete) {
  delete tckSuitesDir
}

tasks.register('stageTckSuites') {
  dependsOn 'cleanTckSuites'
  // Map each resolved artifact to a suite name (runtime, core-modules) taken
  // from the artifact file name, and unzip into suites/<name>/.
  doLast {
    configurations.weaveTckSuite.resolvedConfiguration.resolvedArtifacts.each { artifact ->
      def suiteName = artifact.name // e.g. "runtime", "core-modules"
      copy {
        from zipTree(artifact.file)
        into "${tckSuitesDir}/${suiteName}"
      }
      println("Staged TCK suite '${suiteName}' -> ${tckSuitesDir}/${suiteName}")
    }
  }
}

// Python consumes the corpus already staged for the Node TCK lane above. This
// shares the resolved artifacts and extraction, avoiding a second download.
tasks.register('pythonTck', Exec) {
  dependsOn tasks.named('stagePythonNativeLib')
  workingDir("${projectDir}/python")
  inputs.dir("${projectDir}/python/tests/tck")
  inputs.dir(tckSuitesDir)
  inputs.file("${projectDir}/python/pytest.ini")
  commandLine(pythonExe, '-m', 'pytest', '-m', 'tck')
}

tasks.register('buildNodePackage', Exec) {
  dependsOn tasks.named('stageNodeNativeLib')
  workingDir("${projectDir}/node")
  inputs.dir("${projectDir}/node/src")
  inputs.dir("${projectDir}/node/native")
  inputs.file("${projectDir}/node/package.json")
  inputs.file("${projectDir}/node/binding.gyp")
  inputs.file("${projectDir}/node/tsconfig.json")
  inputs.file("${projectDir}/node/scripts/pack-packages.mjs")
  inputs.property('nativeVersion', project.version.toString())
  outputs.dir("${projectDir}/node/dist")
  outputs.file("${projectDir}/node/build/Release/dwlib_addon.node")
  outputs.file("${projectDir}/node/dataweave-native-${project.version}.tgz")
  outputs.file("${projectDir}/node/dataweave-native-${nodePlatformToken}-${project.version}.tgz")
  environment 'NATIVE_VERSION', project.version.toString()
  doFirst {
    delete("${projectDir}/node/dist")
  }
  if (System.getProperty('os.name').toLowerCase().contains('windows')) {
    commandLine('cmd', '/c', 'npm install && npx node-gyp rebuild && npx tsc && node scripts/pack-packages.mjs')
  } else {
    commandLine('bash', '-c', 'npm install && npx node-gyp rebuild && npx tsc && node scripts/pack-packages.mjs')
  }
}

tasks.register('nodePackTest', Exec) {
  if (project.findProperty('skipNodeTests')?.toString()?.toBoolean() == true) {
    enabled = false
  }

  workingDir("${projectDir}/node")
  commandLine('node', '--test', 'scripts/pack-packages.test.mjs')
}

tasks.register('nodeTest', Exec) {
  if (project.findProperty('skipNodeTests')?.toString()?.toBoolean() == true) {
    enabled = false
  }

  dependsOn tasks.named('stageNodeNativeLib')
  workingDir("${projectDir}/node")
  if (System.getProperty('os.name').toLowerCase().contains('windows')) {
    commandLine('cmd', '/c', 'npm install && npx node-gyp rebuild && npx tsc && npx vitest run')
  } else {
    commandLine('bash', '-c', 'npm install && npx node-gyp rebuild && npx tsc && npx vitest run')
  }
}

// The Node runner as an aggregator-registered runner: emits its result file but
// does NOT render the report (the root :benchmarkCompare renders once over all
// runners). Tagged `benchmarkRunner` so :benchmarkCompare discovers it automatically.
tasks.register('benchmarkNode', Exec) {
  onlyIf { project.findProperty('benchmark')?.toString()?.toBoolean() == true }
  ext.benchmarkRunner = true

  if (!System.getenv('DW_BENCH_NODE_PACKAGE')) {
    dependsOn tasks.named('buildNodePackage')
  }
  workingDir("${rootDir}/benchmarks")

  // Generate the shared input (idempotent, deterministic) then emit; no report here.
  def script = 'node corpus/gen-inputs.mjs && node runners/node/emit.mjs'
  if (System.getProperty('os.name').toLowerCase().contains('windows')) {
    commandLine('cmd', '/c', script)
  } else {
    commandLine('bash', '-c', script)
  }
}

// --- Python runner benchmark tasks ---

// The Python runner as an aggregator-registered runner: emits its result file
// but does NOT render the report (root :benchmarkCompare renders once over all
// runners). Tagged `benchmarkRunner` so :benchmarkCompare discovers it.
tasks.register('benchmarkPython', Exec) {
  onlyIf { project.findProperty('benchmark')?.toString()?.toBoolean() == true }
  ext.benchmarkRunner = true

  if (!System.getenv('DW_BENCH_PY_SITE')) {
    dependsOn tasks.named('stagePythonNativeLib')
  }
  workingDir("${rootDir}/benchmarks")

  // Generate the shared input via the Node generator (idempotent, deterministic,
  // byte-identical to other runners) then emit; no report here.
  def script = 'node corpus/gen-inputs.mjs && ' + pythonExe + ' runners/python/emit.py'
  if (System.getProperty('os.name').toLowerCase().contains('windows')) {
    commandLine('cmd', '/c', script)
  } else {
    commandLine('bash', '-c', script)
  }
}

// Always-on parity guard: pure-stdlib stats + manifest + env tests (no dwlib, no
// venv). Wired into `test` so drift vs lib/stats.mjs fails the normal build.
tasks.register('benchmarkPythonStatsTest', Exec) {
  if (project.findProperty('skipPythonTests')?.toString()?.toBoolean() == true) {
    enabled = false
  }
  workingDir("${rootDir}/benchmarks")
  commandLine(pythonExe, 'runners/python/test_bench.py')
}

// Always-on parity guard for the dwlib-free JS harness tests (shared lib + report
// + node emit builder). Excludes the dwlib-dependent warm-bench/coldstart tests.
tasks.register('benchmarkJsUnitTest', Exec) {
  if (project.findProperty('skipNodeTests')?.toString()?.toBoolean() == true) {
    enabled = false
  }
  workingDir("${rootDir}/benchmarks")
  def files = 'lib/stats.test.mjs lib/manifest.test.mjs lib/env.test.mjs ' +
    'report/report.test.mjs runners/node/emit.test.mjs runners/node/wrapper.test.mjs ' +
    'runners/cli/locate.test.mjs runners/cli/first-run.test.mjs runners/cli/emit.test.mjs'
  def script = 'node --test ' + files
  if (System.getProperty('os.name').toLowerCase().contains('windows')) {
    commandLine('cmd', '/c', script)
  } else {
    commandLine('bash', '-c', script)
  }
}

tasks.named('test') {
  dependsOn tasks.named('pythonTest')
  dependsOn tasks.named('nodePackTest')
  dependsOn tasks.named('nodeTest')
  dependsOn tasks.named('benchmarkPythonStatsTest')
  dependsOn tasks.named('benchmarkJsUnitTest')
}

tasks.named('clean') {
  delete("${projectDir}/python/dist")
  delete("${projectDir}/python/build")
  delete("${projectDir}/python/src/dataweave/native")
  delete("${projectDir}/python/src/dataweave_native.egg-info")
  delete("${projectDir}/node/dist")
  delete("${projectDir}/node/build")
  delete fileTree("${projectDir}/node") { include '*.tgz' }
  delete("${projectDir}/node/native")
  delete("${projectDir}/node/node_modules")
}
