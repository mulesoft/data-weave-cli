dependencies {
  api group: 'org.mule.weave', name: 'runtime', version: weaveVersion
  api group: 'org.mule.weave', name: 'core-modules', version: weaveVersion

  implementation group: 'org.mule.weave', name: 'parser', version: weaveVersion
  implementation group: 'org.mule.weave', name: 'wlang', version: weaveVersion
  compileOnly group: 'org.graalvm.sdk', name: 'graal-sdk', version: graalvmVersion
  compileOnly group: 'org.graalvm.nativeimage', name: 'svm', version: graalvmVersion

  implementation "org.scala-lang:scala-library:${scalaVersion}"
  implementation 'org.json:json:20240303'

  testImplementation platform('org.junit:junit-bom:5.10.0')
  testImplementation 'org.junit.jupiter:junit-jupiter'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
  useJUnitPlatform()
}

tasks.matching { it.name == 'nativeCompileClasspathJar' }.configureEach { t ->
  t.exclude('META-INF/services/org.mule.weave.v2.module.DataFormat')
  t.from("${projectDir}/src/main/resources/META-INF/services/org.mule.weave.v2.module.DataFormat") {
    into('META-INF/services')
    rename { 'org.mule.weave.v2.module.DataFormat' }
  }
  t.exclude('META-INF/services/org.mule.weave.v2.parser.phase.ModuleLoader')
  t.from("${projectDir}/src/main/resources/META-INF/services/org.mule.weave.v2.parser.phase.ModuleLoader") {
    into('META-INF/services')
    rename { 'org.mule.weave.v2.parser.phase.ModuleLoader' }
  }
}

// Declare nativeCompile outputs so dependent tasks can declare proper inputs
tasks.matching { it.name == 'nativeCompile' }.configureEach { t ->
  t.outputs.dir("${buildDir}/native/nativeCompile")
}

// GraalVM native-image emits the shared library as `dwlib.{dylib,so,dll}` (no `lib` prefix),
// but Go cgo and Rust build scripts use `-ldwlib`, which looks up `libdwlib.{dylib,so}`.
// Stage `libdwlib.*` symlinks next to the originals so both naming conventions resolve.
tasks.register('symlinkNativeLibForLinking') {
  dependsOn tasks.named('nativeCompile')
  def nativeDir = file("${buildDir}/native/nativeCompile")
  inputs.dir(nativeDir)
  outputs.upToDateWhen {
    nativeDir.listFiles()?.findAll { it.name.startsWith('dwlib.') }?.every { src ->
      def link = new File(src.parentFile, "lib${src.name}")
      link.exists()
    } ?: false
  }
  doLast {
    nativeDir.listFiles()?.findAll { it.name.startsWith('dwlib.') && !it.name.endsWith('.h') }?.each { src ->
      def link = new File(src.parentFile, "lib${src.name}")
      if (!link.exists()) {
        java.nio.file.Files.createSymbolicLink(link.toPath(), src.toPath().fileName)
      }
    }
  }
}

// Configure GraalVM native-image to build a shared library
graalvmNative {
//  toolchainDetection = true
  binaries {
    main {
      sharedLibrary = true
      debug = true
      verbose = true
      fallback = false
      //agent = false
      useFatJar = true
      //buildArgs.add('-Ob') //  quick build mode to speed up builds during development
      buildArgs.add('--no-fallback')
      buildArgs.add('-H:Name=dwlib')
      buildArgs.add('--verbose')
      buildArgs.add("--report-unsupported-elements-at-runtime")
      buildArgs.add("-J-Xmx6G")

      buildArgs.add("-H:+ReportExceptionStackTraces")
      buildArgs.add("-H:+UnlockExperimentalVMOptions")
      buildArgs.add("--initialize-at-build-time=sun.instrument.InstrumentationImpl")
      buildArgs.add("-H:DeadlockWatchdogInterval=1000")
      buildArgs.add("-H:CompilationExpirationPeriod=0")
      buildArgs.add("-H:+AddAllCharsets")
      buildArgs.add("-H:+IncludeAllLocales")
      buildArgs.add("-H:-SetFileDescriptorLimit")  // Suppress macOS setrlimit warning (harmless errno 22)
      // Pass project directory as system property for header path resolution
      buildArgs.add("-Dproject.root=${projectDir}")
    }
  }
}

def pythonExe = (project.findProperty('pythonExe') ?: 'python3') as String

tasks.register('stagePythonNativeLib', Copy) {
  dependsOn tasks.named('nativeCompile')
  from("${buildDir}/native/nativeCompile") {
    include('dwlib.*')
  }
  into("${projectDir}/python/src/dataweave/native")
}

tasks.register('buildPythonWheel', Exec) {
  dependsOn tasks.named('stagePythonNativeLib')
  workingDir("${projectDir}/python")
  // Track inputs so Gradle rebuilds when native lib or Python sources change
  inputs.dir("${projectDir}/python/src/dataweave")
  inputs.file("${projectDir}/python/setup.py")
  inputs.file("${projectDir}/python/setup.cfg")
  inputs.file("${projectDir}/python/pyproject.toml")
  outputs.dir("${projectDir}/python/dist")
  doFirst {
    // Clean old wheels and build artifacts to ensure fresh build
    delete("${projectDir}/python/dist")
    delete("${projectDir}/python/build")
    file("${projectDir}/python/dist").mkdirs()
  }
  // Use setup.py bdist_wheel to generate platform-specific wheel tags
  // The custom setup.py overrides bdist_wheel to set correct platform tags
  // for the bundled native library (dwlib)
  commandLine(pythonExe, 'setup.py', 'bdist_wheel', '-d', 'dist')
}

tasks.register('pythonTest', Exec) {
  if (project.findProperty('skipPythonTests')?.toString()?.toBoolean() == true) {
    enabled = false
  }

  dependsOn tasks.named('stagePythonNativeLib')
  workingDir("${projectDir}/python")
  commandLine(pythonExe, 'tests/test_dataweave_module.py')
}

// Resolve a tool absolute path so the Exec tasks work even if the Gradle daemon
// was launched without /opt/homebrew/bin or ~/.cargo/bin on PATH.
def resolveTool = { String tool, List<String> extraDirs ->
  def envProp = project.findProperty("${tool}Exe")?.toString()
  if (envProp) return envProp
  def envVar = System.getenv("${tool.toUpperCase()}_EXE")
  if (envVar) return envVar
  List<String> candidates = []
  def pathEnv = System.getenv('PATH') ?: ''
  candidates.addAll(Arrays.asList(pathEnv.split(File.pathSeparator)) as List<String>)
  candidates.addAll(extraDirs)
  for (String dir : candidates) {
    if (!dir) continue
    File f = new File(dir, tool)
    if (f.canExecute()) return f.absolutePath
  }
  return tool // fall back to bare name; will fail clearly if missing
}

def goExe = resolveTool('go', ['/opt/homebrew/bin', '/usr/local/bin', "${System.getenv('HOME')}/go/bin"])
def cargoExe = resolveTool('cargo', ["${System.getenv('HOME')}/.cargo/bin", '/opt/homebrew/bin', '/usr/local/bin'])

tasks.register('goTest', Exec) {
  if (project.findProperty('skipGoTests')?.toString()?.toBoolean() == true) {
    enabled = false
  }

  dependsOn tasks.named('symlinkNativeLibForLinking')
  inputs.dir("${buildDir}/native/nativeCompile")
  inputs.files(fileTree("${projectDir}/go").include("**/*.go", "go.mod", "go.sum"))
  outputs.file("${buildDir}/test-results/go/test.out")
  workingDir("${projectDir}/go")
  doFirst {
    file("${buildDir}/test-results/go").mkdirs()
  }
  commandLine(goExe, 'test', '-v')
  doLast {
    // Write test result marker
    file("${buildDir}/test-results/go/test.out").text = "Tests completed at ${new Date()}"
  }
}

tasks.register('goTestRace', Exec) {
  if (project.findProperty('skipGoTests')?.toString()?.toBoolean() == true) {
    enabled = false
  }

  dependsOn tasks.named('symlinkNativeLibForLinking')
  inputs.dir("${buildDir}/native/nativeCompile")
  inputs.files(fileTree("${projectDir}/go").include("**/*.go", "go.mod", "go.sum"))
  outputs.file("${buildDir}/test-results/go/test-race.out")
  workingDir("${projectDir}/go")
  doFirst {
    file("${buildDir}/test-results/go").mkdirs()
  }
  commandLine(goExe, 'test', '-race', '-v')
  doLast {
    // Write test result marker
    file("${buildDir}/test-results/go/test-race.out").text = "Race tests completed at ${new Date()}"
  }
}

tasks.register('rustTest', Exec) {
  if (project.findProperty('skipRustTests')?.toString()?.toBoolean() == true) {
    enabled = false
  }

  dependsOn tasks.named('symlinkNativeLibForLinking')
  inputs.dir("${buildDir}/native/nativeCompile")
  inputs.files(fileTree("${projectDir}/rust/src").include("**/*.rs"))
  inputs.files(fileTree("${projectDir}/rust/tests").include("**/*.rs"))
  inputs.files(fileTree("${projectDir}/rust/examples").include("**/*.rs"))
  inputs.file("${projectDir}/rust/Cargo.toml")
  inputs.file("${projectDir}/rust/build.rs")
  outputs.file("${buildDir}/test-results/rust/test.out")
  workingDir("${projectDir}/rust")
  doFirst {
    file("${buildDir}/test-results/rust").mkdirs()
  }
  commandLine(cargoExe, 'test', '--', '--test-threads=1')
  doLast {
    // Write test result marker
    file("${buildDir}/test-results/rust/test.out").text = "Tests completed at ${new Date()}"
  }
}

tasks.named('test') {
  dependsOn tasks.named('pythonTest')
  dependsOn tasks.named('goTest')
  dependsOn tasks.named('rustTest')
}

tasks.named('build') {
  dependsOn tasks.named('test')
}

tasks.named('clean') {
  delete("${projectDir}/python/dist")
  delete("${projectDir}/python/build")
  delete("${projectDir}/python/src/dataweave/native")
  delete("${projectDir}/python/src/dataweave_native.egg-info")
  delete("${projectDir}/go/*.test")
  delete("${projectDir}/rust/target")
  delete("${buildDir}/test-results")
}
