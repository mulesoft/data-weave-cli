[package]
name = "dataweave-native"
version = "0.1.0"
edition = "2021"
authors = ["MuleSoft"]
description = "Rust bindings for the DataWeave native library"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mulesoft/data-weave-cli"
keywords = ["dataweave", "graalvm", "ffi", "transformation"]
categories = ["api-bindings", "parsing"]

[dependencies]
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
once_cell = "1.19"
libloading = "0.8"

[dev-dependencies]
tempfile = "3.8"

[lib]
name = "dataweave_native"
path = "src/lib.rs"

[[test]]
name = "integration_tests"
path = "tests/integration_tests.rs"
